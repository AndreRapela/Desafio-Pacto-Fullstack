spring.application.name=Recrutamento
server.port=8080

spring.datasource.url = ${DB_URL:jdbc:postgresql://localhost:5432/recrutamento}
spring.datasource.username = ${DB_USERNAME:postgres}
spring.datasource.password = ${DB_PASSWORD:postgres}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

spring.jackson.default-property-inclusion=non_null

app.jwt.secret=${JWT_SECRET: secret}
app.jwt.expiration=${JWT_EXPIRATION: 28800}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management.endpoint.web.exposure.include=health,info

springdoc.swagger-ui.path=/swagger-ui.html