services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recrutamento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recrutamento"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:  "./BackEnd - Spring/Recrutamento"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/recrutamento
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: altere-esta-chave-em-producao-com-no-minimo-32-caracteres
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:  "./FrontEnd - Angular/Recrutamento"
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
